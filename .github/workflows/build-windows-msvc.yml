name: Build (Windows MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    name: Native Windows build (MSVC)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache .deps (fb2k SDK)
        uses: actions/cache@v5
        with:
          path: .deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-windows-

      # ── x64 build ────────────────────────────────────────────────────────
      - name: Configure (x64)
        run: cmake --preset windows-msvc

      - name: Build (x64)
        run: cmake --build build-msvc --config Release --parallel

      # ── x86 build ────────────────────────────────────────────────────────
      - name: Configure (x86)
        run: cmake --preset windows-msvc-x86

      - name: Build (x86)
        run: cmake --build build-msvc-x86 --config Release --parallel

      # ── Sign ─────────────────────────────────────────────────────────────
      - name: Check code-signing prerequisites
        id: codesign
        shell: bash
        env:
          OSSLSIGNSERVER_URL: ${{ secrets.OSSLSIGNSERVER_URL }}
          OSSLSIGNSERVER_API_KEY_SECRET: ${{ secrets.OSSLSIGNSERVER_API_KEY_SECRET }}
        run: |
          if [[ -n "$OSSLSIGNSERVER_URL" && -n "$OSSLSIGNSERVER_API_KEY_SECRET" && -n "${{ vars.OSSLSIGNSERVER_PROFILE }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign x64 DLL
        if: steps.codesign.outputs.enabled == 'true'
        uses: icedream/sign-with-osslsignserver-action@acc508fca11a08518189b3526ecd8d6ffdeaa4e9
        with:
          url: ${{ secrets.OSSLSIGNSERVER_URL }}
          api-key-secret: ${{ secrets.OSSLSIGNSERVER_API_KEY_SECRET }}
          profile: ${{ vars.OSSLSIGNSERVER_PROFILE }}
          file: ${{ github.workspace }}/build-msvc/Release/foo_qobuz.dll
          description: 'Qobuz for foobar2000'
          description-url: 'https://github.com/icedream/fb2k-qobuz'

      - name: Sign x86 DLL
        if: steps.codesign.outputs.enabled == 'true'
        uses: icedream/sign-with-osslsignserver-action@acc508fca11a08518189b3526ecd8d6ffdeaa4e9
        with:
          url: ${{ secrets.OSSLSIGNSERVER_URL }}
          api-key-secret: ${{ secrets.OSSLSIGNSERVER_API_KEY_SECRET }}
          profile: ${{ vars.OSSLSIGNSERVER_PROFILE }}
          file: ${{ github.workspace }}/build-msvc-x86/Release/foo_qobuz.dll
          description: 'Qobuz for foobar2000'
          description-url: 'https://github.com/icedream/fb2k-qobuz'

      # ── Package ──────────────────────────────────────────────────────────
      # VS generator places DLLs under <build-dir>/Release/
      - name: Package .fb2k-component
        shell: pwsh
        run: |
          $x64dll = "${{ github.workspace }}\build-msvc\Release\foo_qobuz.dll"
          $x86dll = "${{ github.workspace }}\build-msvc-x86\Release\foo_qobuz.dll"
          $output = "${{ github.workspace }}\foo_qobuz.fb2k-component"
          cmake "-DFOO_DLL=$x64dll" "-DOUTPUT=$output" "-DARCH_X86=FALSE" "-DEXTRA_DLL=$x86dll" -P cmake/package_component.cmake

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: foo_qobuz-windows-msvc
          path: foo_qobuz.fb2k-component
          if-no-files-found: error
