name: Build (Linux cross-compile)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  XWIN_VERSION: "0.9.0"
  LLVM_VERSION: "20"

jobs:
  build:
    name: Cross-compile for Windows (clang-cl + xwin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh \
            | sudo bash -s -- ${{ env.LLVM_VERSION }} all
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          # Ensure unversioned aliases exist (clang-cl, lld-link, llvm-rc, llvm-mt)
          for tool in clang clang-cl clang-cpp lld lld-link llvm-rc llvm-mt; do
            sudo ln -sf /usr/bin/${tool}-${{ env.LLVM_VERSION }} /usr/local/bin/${tool} 2>/dev/null || true
          done

      - name: Install xwin
        run: |
          curl -fsSL https://github.com/Jake-Shadle/xwin/releases/download/${{ env.XWIN_VERSION }}/xwin-${{ env.XWIN_VERSION }}-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 --wildcards -C /usr/local/bin '*/xwin'
          xwin --version

      # Cache both xwin output and fb2k SDK. Key on CMakeLists.txt so a deps
      # change (e.g. SDK version bump) busts the cache.
      - name: Cache .deps
        uses: actions/cache@v5
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Splat Windows SDK headers (xwin)
        run: |
          if [ ! -d .deps/xwin/crt/lib/x86_64 ] || [ ! -d .deps/xwin/crt/lib/x86 ]; then
            xwin --accept-license \
              --arch x86 --arch x86_64 \
              --cache-dir .deps/xwin-cache \
              splat --output .deps/xwin
          fi

      # ── x64 build ────────────────────────────────────────────────────────
      - name: Configure (x64)
        run: |
          cmake --preset linux-cross \
            -DXWIN_DIR="${{ github.workspace }}/.deps/xwin" \
            -DXWIN_AUTO_DOWNLOAD=OFF \
            -DXWIN_ACCEPT_LICENSE=OFF

      - name: Build (x64)
        run: cmake --build build-clang --parallel

      # ── x86 build ────────────────────────────────────────────────────────
      - name: Configure (x86)
        run: |
          cmake --preset linux-cross-x86 \
            -DXWIN_DIR="${{ github.workspace }}/.deps/xwin" \
            -DXWIN_AUTO_DOWNLOAD=OFF \
            -DXWIN_ACCEPT_LICENSE=OFF

      - name: Build (x86)
        run: cmake --build build-clang-x86 --parallel

      # ── Package ──────────────────────────────────────────────────────────
      - name: Package .fb2k-component
        run: |
          cmake \
            -DFOO_DLL="${{ github.workspace }}/build-clang/foo_qobuz.dll" \
            -DOUTPUT="${{ github.workspace }}/foo_qobuz.fb2k-component" \
            -DARCH_X86=FALSE \
            -DEXTRA_DLL="${{ github.workspace }}/build-clang-x86/foo_qobuz.dll" \
            -P cmake/package_component.cmake

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: foo_qobuz-linux-cross
          path: foo_qobuz.fb2k-component
          if-no-files-found: error
