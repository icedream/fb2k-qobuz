name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build-component.yml
    with:
      artifact-name: foo_qobuz-release

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: foo_qobuz-release

      - name: Rename artifact with version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip leading 'v'
          mv foo_qobuz.fb2k-component "foo_qobuz-${VERSION}.fb2k-component"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          files: foo_qobuz-*.fb2k-component
          draft: false
          prerelease: false
          generate_release_notes: true
